<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f3f7">
  <title>Revit Bridge</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Path ABSOLUT, bukan relatif. Halaman ini disajikan di tiga alamat
       sekaligus (/, /panel, /web/index.html) lewat rewrite di vercel.json.
       Dengan `./theme.css`, di alamat `/` berkasnya dicari di `/theme.css`
       yang tidak ada — dan halaman tampil polos tanpa satu pun pesan error. -->
  <link rel="stylesheet" href="/web/theme.css">
  <link rel="stylesheet" href="/web/panel.css">
</head>
<body>
  <div class="shell">

    <header class="topbar glass">
      <div class="topbar__id">
        <div class="mark" aria-hidden="true">⚡</div>
        <div>
          <h1 data-i18n="app.title">Revit Bridge</h1>
          <p class="muted" data-i18n="app.subtitle"></p>
        </div>
      </div>

      <div class="topbar__prefs">
        <!-- Toggle bahasa: ID / EN / Auto -->
        <div class="segment" id="lang-segment" style="--count:3" role="tablist" data-i18n-label="pref.language">
          <span class="segment__thumb"></span>
          <button role="tab" data-value="id" aria-selected="false">ID</button>
          <button role="tab" data-value="en" aria-selected="false">EN</button>
          <button role="tab" data-value="auto" aria-selected="false" data-i18n="theme.auto"></button>
        </div>

        <!-- Toggle tema: Terang / Gelap / Auto -->
        <div class="segment" id="theme-segment" style="--count:3" role="tablist" data-i18n-label="pref.theme">
          <span class="segment__thumb"></span>
          <button role="tab" data-value="light" aria-selected="false" data-i18n="theme.light"></button>
          <button role="tab" data-value="dark" aria-selected="false" data-i18n="theme.dark"></button>
          <button role="tab" data-value="auto" aria-selected="false" data-i18n="theme.auto"></button>
        </div>
      </div>
    </header>

    <main class="grid">

      <section class="card glass" id="status-card" aria-live="polite">
        <div class="card__head">
          <span class="dot dot--warn" id="status-dot"></span>
          <h2 id="status-title">…</h2>
        </div>
        <dl class="kv">
          <div><dt data-i18n="status.model"></dt><dd id="kv-model">—</dd></div>
          <div><dt data-i18n="status.lastSeen"></dt><dd id="kv-seen">—</dd></div>
          <div><dt data-i18n="status.revit"></dt><dd id="kv-revit" class="mono">—</dd></div>
          <div><dt data-i18n="status.addin"></dt><dd id="kv-addin" class="mono">—</dd></div>
        </dl>
      </section>

      <section class="card glass" id="queue-card">
        <div class="card__head"><h2 data-i18n="queue.title"></h2></div>
        <div class="stats">
          <div class="stat glass--inset"><b id="stat-pending">0</b><span data-i18n="queue.pending"></span></div>
          <div class="stat glass--inset"><b id="stat-running">0</b><span data-i18n="queue.running"></span></div>
          <div class="stat glass--inset"><b id="stat-done">0</b><span data-i18n="queue.done"></span></div>
        </div>
        <ul class="queue" id="queue-list"></ul>
        <p class="muted empty" id="queue-empty" data-i18n="queue.empty"></p>
      </section>

      <section class="card glass" id="cmd-card">
        <div class="card__head">
          <h2 data-i18n="cmd.title"></h2>
          <span class="muted small" data-i18n="cmd.hint"></span>
        </div>
        <div id="cmd-sections"></div>
      </section>

      <!-- Hanya untuk admin; app.js yang membuka `hidden`-nya. Disembunyikan
           dari HTML, bukan dari CSS: sebelum /api/panel/state menjawab, peran
           pembukanya belum diketahui. -->
      <section class="card glass" id="users-card" hidden>
        <div class="card__head">
          <h2 data-i18n="users.title"></h2>
          <span class="muted small" data-i18n="users.hint"></span>
        </div>

        <form class="field" id="user-form" autocomplete="off">
          <input class="input mono" id="user-chatid" inputmode="numeric"
                 required data-i18n-placeholder="users.chatId">
          <input class="input" id="user-name" maxlength="64"
                 required data-i18n-placeholder="users.name">
          <select class="input" id="user-role" data-i18n-label="users.role">
            <option value="viewer" data-i18n="role.viewer"></option>
            <option value="admin" data-i18n="role.admin"></option>
          </select>
          <button class="btn btn--primary" type="submit" data-i18n="users.add"></button>
        </form>

        <ul class="users" id="user-list"></ul>
        <p class="muted empty" id="users-empty" data-i18n="users.empty"></p>
        <p class="muted small" id="users-note" data-i18n="users.menuNote"></p>
      </section>

      <section class="card glass" id="pref-card">
        <div class="card__head"><h2 data-i18n="pref.title"></h2></div>
        <p class="muted small" data-i18n="theme.autoNote"></p>
        <button class="btn" id="refresh" data-i18n="action.refresh"></button>
      </section>

    </main>
  </div>

  <!-- Absolut juga. Import di dalam app.js ('./theme.js', './i18n.js')
       diselesaikan relatif terhadap URL modul ini, jadi tetap benar. -->
  <script type="module" src="/web/app.js"></script>
</body>
</html>
