# Penjaga yang selama ini hanya ada di dokumentasi.
#
# `scripts/check-i18n.ts` menulis "jalankan di CI", tapi CI-nya belum pernah
# ada — jadi satu-satunya yang menjalankannya adalah orang yang ingat. Kelima
# pemeriksaan di `npm run check` menangkap kerusakan yang TIDAK menimbulkan
# error saat runtime: key terjemahan yang hilang diam-diam jatuh ke Bahasa
# Indonesia, daftar command panel yang menyimpang hanya menampilkan lebih
# sedikit tombol, dan berkas hasil yang tidak pernah sampai cuma terlihat
# sebagai "⏳" yang tidak berubah.

name: check

on:
  push:
    branches: ['**']
  pull_request:
  # Bisa dijalankan manual dari tab Actions.
  #
  # Ditambahkan setelah GitHub berhenti membuat run dari event `push` selama
  # beberapa jam: `addin.yml` masih bisa dipicu tangan karena punya baris ini,
  # sementara pemeriksaan server sama sekali tidak bisa dijalankan — satu-satunya
  # penjaga yang tersisa jadi ingatan orang. Tombol yang cuma berguna sekali
  # setahun tetap lebih murah daripada tidak punya jalan sama sekali saat
  # dibutuhkan.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # typecheck + i18n + daftar command panel + format modul + simulasi job
      - run: npm run check
