# Penjaga yang selama ini hanya ada di dokumentasi.
#
# `scripts/check-i18n.ts` menulis "jalankan di CI", tapi CI-nya belum pernah
# ada — jadi satu-satunya yang menjalankannya adalah orang yang ingat. Ketiga
# pemeriksaan di sini menangkap kerusakan yang TIDAK menimbulkan error saat
# runtime: key terjemahan yang hilang diam-diam jatuh ke Bahasa Indonesia, dan
# daftar command panel yang menyimpang hanya menampilkan lebih sedikit tombol.

name: check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # typecheck + i18n + sinkronisasi daftar command panel
      - run: npm run check
